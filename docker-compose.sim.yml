version: "3.8"

networks:
  sim-net:
    driver: bridge

services:
  node1:
    build:
      context: .
      dockerfile: prototypes/Dockerfile.debug
    image: aether-prototype:debug
    container_name: node1
    stdin_open: true
    tty: true
    networks:
      - sim-net
    ports:
      - "8001:8001/udp"
    command: ["8001"]
    volumes:
      - ./prototypes/certs:/app/certs
      - ./recv:/app/recv
    deploy:
      resources:
        limits:
          memory: 64M

  node2:
    image: aether-prototype:debug
    container_name: node2
    depends_on:
      - node1
    networks:
      - sim-net
    ports:
      - "8002:8002/udp"
    command: ["8002", "node1:8001", "/app/send/10M.bin"]
    volumes:
      - ./prototypes/certs:/app/certs
      - ./send:/app/send:ro
    deploy:
      resources:
        limits:
          memory: 64M

  node3:
